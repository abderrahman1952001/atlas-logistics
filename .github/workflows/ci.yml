name: Atlas verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlas-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: PostgreSQL workflow and container verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: http://localhost:8080
      APP_ORIGIN: http://localhost:8080
      DEMO_MODE: 'true'
      DEMO_PASSWORD: AtlasDemo!2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Validate compose and build the real stack
        run: |
          docker compose config --quiet
          docker compose up --build -d
      - name: Wait for database-backed readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent "$BASE_URL/health/ready"; then exit 0; fi
            sleep 2
          done
          docker compose logs --no-color
          exit 1
      - name: Verify frontend, API, isolation and concurrent booking
        run: |
          curl --fail --silent "$BASE_URL/" | grep -q '<div id="root"'
          node --test --test-concurrency=1 tests/*.test.mjs
      - name: Restart PostgreSQL and API and verify persisted records
        run: |
          docker compose restart db api
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$BASE_URL/health/ready"; then break; fi
            sleep 2
          done
          node tests/persistence.mjs
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=150
      - name: Cleanup
        if: always()
        run: docker compose down -v
